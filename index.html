    <style>
        /* =========================================
           VARIÁVEIS DE CORES & PALETA EXTRAÍDA
           ========================================= */
        :root {
            /* Fundo Quente Premium (Tons escuros da logo/pizzaria) */
            --bg-dark-1: #2B0A0A; /* Bordô muito escuro (topo) */
            --bg-dark-2: #110505; /* Quase preto avermelhado (base) */
            --text-light: #FFFFFF;
            
            /* Cores das Plataformas */
            --proprio-color: #00C853; /* Verde conversão para o Cardápio Próprio */
            --ifood-color: #EA1D2C;
            --food99-color: #F6B32E;
            --keeta-color: #FFB800;
        }

        /* =========================================
           RESET E BASE
           ========================================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            /* Aplicação do background alinhado com a paleta da pizzaria */
            background: radial-gradient(circle at top, var(--bg-dark-1) 0%, var(--bg-dark-2) 100%);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            padding-bottom: 50px;
        }

        .main-container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* =========================================
           CABEÇALHO (LOGO E BIO)
           ========================================= */
        .header {
            text-align: center;
            margin-top: 40px;
            margin-bottom: 30px;
            padding: 0 20px;
            animation: fadeInDown 0.8s ease;
        }

        .logo-wrapper {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 4px solid var(--proprio-color); /* Borda verde conectando com o CTA principal */
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            overflow: hidden;
            margin: 0 auto 15px auto;
            background-color: #fff;
        }

        .logo-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .header h1 {
            font-size: 1.7rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
            text-shadow: 0 3px 6px rgba(0,0,0,1);
        }

        .header p {
            font-size: 1.05rem;
            color: #E0D4D4; /* Branco com leve toque quente */
            font-weight: 500;
            font-style: italic;
        }

        .section-title {
            font-size: 0.9rem;
            color: #A89595;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 12px;
            font-weight: 600;
            text-align: center;
        }

        /* =========================================
           CARDS DE PLATAFORMAS (LINKS)
           ========================================= */
        .links-section {
            width: 100%;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 45px;
        }

        .platform-card {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            height: 95px;
            border-radius: 16px;
            text-decoration: none;
            overflow: hidden;
            padding: 0 20px;
            background: #1A0D0D;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        /* CARD DESTAQUE: CARDÁPIO PRÓPRIO */
        .highlight-card {
            height: 120px; /* Maior que os outros */
            border: 2px solid var(--proprio-color);
            box-shadow: 0 8px 25px rgba(0, 200, 83, 0.25);
            margin-bottom: 8px;
        }

        /* Etiqueta de Vantagem no Card Principal */
        .ribbon {
            position: absolute;
            top: 0;
            left: 20px;
            background-color: var(--proprio-color);
            color: #000;
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            padding: 4px 12px;
            border-radius: 0 0 8px 8px;
            z-index: 3;
            letter-spacing: 1px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        .card-ifood { border-left: 5px solid var(--ifood-color); }
        .card-99food { border-left: 5px solid var(--food99-color); }
        .card-keeta { border-left: 5px solid var(--keeta-color); }

        .platform-card:active {
            transform: scale(0.96);
        }

        /* Imagem/Banner da Plataforma dentro do card */
        .platform-logo-box {
            display: flex;
            align-items: center;
            z-index: 2;
            height: 100%;
            padding: 10px 0;
        }

        .platform-logo-box img {
            height: auto;
            max-height: 45px;
            width: auto;
            max-width: 140px;
            object-fit: contain;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }

        .platform-name-fallback {
            font-size: 1.4rem;
            font-weight: 900;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            letter-spacing: -0.5px;
        }

        .text-proprio { color: #FFFFFF; font-size: 1.6rem;}

        /* Overlay escuro sobre o fundo do card para leitura */
        .platform-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(90deg, rgba(15,5,5,0.95) 0%, rgba(15,5,5,0.5) 100%);
            z-index: 1;
        }

        /* Imagens de fundo temporárias (Proporção 1000x220px) */
        .card-proprio { background-image: url('https://images.unsplash.com/photo-1604382354936-07c5d9983bd3?auto=format&fit=crop&w=1000&q=80'); background-size: cover; background-position: center; }
        .card-ifood { background-image: url('https://i.ibb.co/hRV7v0b9/Pizza-doce-limoneto-ifood.png'); background-size: cover; background-position: center; }
        .card-99food { background-image: url('https://i.ibb.co/PZTXzSkR/Atum-1.png'); background-size: cover; background-position: center; }
        .card-keeta { background-image: url('https://i.ibb.co/RL9XCL8/Calabresa-1.png'); background-size: cover; background-position: center; }

        /* =========================================
           BOTÕES CTA PREMIUM
           ========================================= */
        .cta-btn {
            z-index: 2;
            padding: 10px 22px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            white-space: nowrap;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5), inset 0 2px 5px rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-proprio {
            background: linear-gradient(135deg, #00E676 0%, #00C853 100%);
            color: #000000;
            font-size: 0.95rem;
            padding: 12px 26px;
            animation: pulse-btn-green 2s infinite;
            box-shadow: 0 4px 15px rgba(0,200,83,0.4), inset 0 2px 5px rgba(255,255,255,0.6);
        }

        .btn-ifood { background: linear-gradient(135deg, #EA1D2C 0%, #B81320 100%); color: #FFFFFF; }
        .btn-99food { background: linear-gradient(135deg, #F6B32E 0%, #D9981D 100%); color: #111111; }
        .btn-keeta { background: linear-gradient(135deg, #FFB800 0%, #D49900 100%); color: #111111; }

        .cta-btn::after {
            content: '›';
            font-size: 1.2rem;
            line-height: 0.5;
            margin-bottom: 2px;
            font-weight: 400;
        }

        @keyframes pulse-btn-green {
            0% { transform: scale(1); box-shadow: 0 4px 15px rgba(0,200,83,0.4), inset 0 2px 5px rgba(255,255,255,0.6); }
            50% { transform: scale(1.06); box-shadow: 0 6px 20px rgba(0,200,83,0.6), inset 0 2px 5px rgba(255,255,255,0.8); }
            100% { transform: scale(1); box-shadow: 0 4px 15px rgba(0,200,83,0.4), inset 0 2px 5px rgba(255,255,255,0.6); }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* =========================================
           CARROSSEL INFINITO
           ========================================= */
        .carousel-container {
            width: 100%;
            text-align: center;
            margin-bottom: 45px;
        }

        .carousel-section {
            width: 100vw;
            overflow: hidden;
            position: relative;
            -webkit-mask-image: linear-gradient(to right, transparent, black 5%, black 95%, transparent);
            mask-image: linear-gradient(to right, transparent, black 5%, black 95%, transparent);
        }

        .carousel-track {
            display: flex;
            width: calc(220px * 8 + 15px * 8); 
            animation: scroll-carousel 25s linear infinite;
        }

        .carousel-track:hover {
            animation-play-state: paused;
        }

        .carousel-item {
            width: 220px;
            height: 160px;
            margin: 0 7.5px;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 5px 15px rgba(0,0,0,0.8);
            border: 1px solid rgba(255,255,255,0.05);
        }

        .carousel-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .carousel-item:hover img {
            transform: scale(1.1);
        }

        @keyframes scroll-carousel {
            0% { transform: translateX(0); }
            100% { transform: translateX(calc(-220px * 4 - 15px * 4)); }
        }

        /* =========================================
           MAPA (LOCALIZAÇÃO) NO FINAL
           ========================================= */
        .map-section {
            width: 100%;
            padding: 0 20px;
            margin-bottom: 10px;
        }

        .map-container {
            width: 100%;
            height: 180px;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            background-color: #1A0D0D;
        }

        .map-container iframe {
            width: 100%;
            height: 100%;
            border: 0;
            filter: invert(90%) hue-rotate(180deg) brightness(80%) contrast(90%);
        }

    </style>
