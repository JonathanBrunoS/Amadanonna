    <style>
        /* =========================================
           VARIÁVEIS DE CORES & PALETA
           ========================================= */
        :root {
            /* Fundo escuro premium liso para destacar os banners */
            --bg-dark: #121212; 
            --text-light: #FFFFFF;
            
            /* Borda da Logo (Vermelho Pizzaria) */
            --logo-border: #EA1D2C;
            
            /* Cores dos CTAs das Plataformas */
            --cta-proprio: #00C853; 
            --cta-ifood: #EA1D2C;
            --cta-99food: #F6B32E;
            --cta-keeta: #FFB800;
        }

        /* =========================================
           RESET E BASE
           ========================================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            padding-bottom: 50px;
        }

        .main-container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* =========================================
           CABEÇALHO (LOGO E BIO)
           ========================================= */
        .header {
            text-align: center;
            margin-top: 40px;
            margin-bottom: 30px;
            padding: 0 20px;
            animation: fadeInDown 0.8s ease;
        }

        .logo-wrapper {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 4px solid var(--logo-border);
            box-shadow: 0 8px 25px rgba(234, 29, 44, 0.2);
            overflow: hidden;
            margin: 0 auto 15px auto;
            background-color: #fff;
        }

        .logo-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .header h1 {
            font-size: 1.7rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 1.05rem;
            color: #E0D4D4; 
            font-weight: 500;
            font-style: italic;
        }

        .section-title {
            font-size: 0.9rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
            font-weight: 600;
            text-align: center;
        }

        /* =========================================
           CARDS DE PLATAFORMAS (ESTILO BISTRÔ)
           ========================================= */
        .links-section {
            width: 100%;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 45px;
        }

        /* Estrutura do Card: Imagem em cima, Botão embaixo */
        .banner-card {
            display: flex;
            flex-direction: column;
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            text-decoration: none;
            background-color: #000;
            box-shadow: 0 6px 15px rgba(0,0,0,0.5);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .banner-card:active {
            transform: scale(0.97);
            box-shadow: 0 2px 8px rgba(0,0,0,0.8);
        }

        /* Container da Imagem do Banner */
        .banner-img-box {
            width: 100%;
            display: block;
            border-bottom: 1px solid rgba(0,0,0,0.2);
        }

        .banner-img-box img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        /* Barra Inferior (CTA) */
        .banner-cta {
            width: 100%;
            padding: 14px 0;
            text-align: center;
            font-size: 1.1rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* Seta Dinâmica */
        .banner-cta::after {
            content: '➔';
            font-size: 1.2rem;
            margin-top: 1px;
        }

        /* Cores Específicas dos CTAs */
        .cta-proprio { background-color: var(--cta-proprio); color: #000; }
        .cta-ifood { background-color: var(--cta-ifood); color: #FFF; }
        .cta-99food { background-color: var(--cta-99food); color: #000; }
        .cta-keeta { background-color: var(--cta-keeta); color: #000; }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* =========================================
           CARROSSEL INFINITO
           ========================================= */
        .carousel-container {
            width: 100%;
            text-align: center;
            margin-bottom: 45px;
        }

        .carousel-section {
            width: 100vw;
            overflow: hidden;
            position: relative;
            -webkit-mask-image: linear-gradient(to right, transparent, black 5%, black 95%, transparent);
            mask-image: linear-gradient(to right, transparent, black 5%, black 95%, transparent);
        }

        .carousel-track {
            display: flex;
            width: calc(220px * 8 + 15px * 8); 
            animation: scroll-carousel 25s linear infinite;
        }

        .carousel-track:hover {
            animation-play-state: paused;
        }

        .carousel-item {
            width: 220px;
            height: 160px;
            margin: 0 7.5px;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 5px 15px rgba(0,0,0,0.8);
            border: 1px solid rgba(255,255,255,0.05);
        }

        .carousel-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .carousel-item:hover img {
            transform: scale(1.1);
        }

        @keyframes scroll-carousel {
            0% { transform: translateX(0); }
            100% { transform: translateX(calc(-220px * 4 - 15px * 4)); }
        }

        /* =========================================
           MAPA (LOCALIZAÇÃO) NO FINAL
           ========================================= */
        .map-section {
            width: 100%;
            padding: 0 20px;
            margin-bottom: 10px;
        }

        .map-container {
            width: 100%;
            height: 180px;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            background-color: #121212;
        }

        .map-container iframe {
            width: 100%;
            height: 100%;
            border: 0;
            filter: invert(90%) hue-rotate(180deg) brightness(80%) contrast(90%);
        }
